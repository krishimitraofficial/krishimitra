{id:'m6',name:'Cultivator 9 Tyne',type:'Cultivator',owner:'Suresh Kulkarni',phone:'9876543215',location:'Yavatmal, MH',distance:18,priceHour:600,priceDay:4000,rating:4.5,availability:true,image:'https://images.unsplash.com/photo-1500930540495-e92875696a16?w=600',desc:'For secondary tillage operations.',work:['tilling','cultivation']}
];
function getMachines(){let d=localStorage.getItem('km_machines'); if(!d){localStorage.setItem('km_machines',JSON.stringify(demoMachines)); return demoMachines;} return JSON.parse(d);}
function saveMachines(m){localStorage.setItem('km_machines',JSON.stringify(m));}
function getBookings(){return JSON.parse(localStorage.getItem('km_bookings')||'[]');}
function saveBookings(b){localStorage.setItem('km_bookings',JSON.stringify(b));}
function getUser(){return JSON.parse(localStorage.getItem('km_user')||'null');}
function getFavs(){return JSON.parse(localStorage.getItem('km_fav')||'[]');}

// ---------- AI MATCH ----------
function aiScore(machine, filters){
 let locScore = Math.max(0,100 - machine.distance*3);
 let workScore = 50; if(filters.work){ workScore = machine.work.some(w=>filters.work.toLowerCase().includes(w))?98:40; } else workScore=85;
 let priceScore = 100; if(filters.budget){ let perDay = parseInt(filters.budget)||7000; priceScore = machine.priceDay <= perDay? 95 : Math.max(20, 100 - (machine.priceDay-perDay)/50); }
 let availScore = machine.availability?95:30;
 let total = Math.round(0.4*locScore + 0.3*workScore + 0.2*priceScore + 0.1*availScore);
 return {total, locScore:Math.round(locScore), workScore, priceScore:Math.round(priceScore), availScore};
}

// ---------- NAVIGATION ----------
let currentPage='home';
let findFilters={};
function navigate(p){currentPage=p; render(); window.scrollTo(0,0);}
function toggleMobile(){document.getElementById('mobileMenu').classList.toggle('hidden');}
function openDashboard(){let u=getUser(); if(!u){navigate('login');return;} if(u.role==='owner') navigate('ownerDash'); else navigate('farmerDash');}
function checkAuth(){
 let u=getUser();
 let lb=document.getElementById('loginBtn'); let db=document.getElementById('dashBtn');
 if(u){lb.innerText=u.name.split(' ')[0]; db.classList.remove('hidden');} else {lb.innerText='Login'; db.classList.add('hidden');}
}

// ---------- RENDER ----------
function render(){
 checkAuth();
 let app=document.getElementById('app');
 if(currentPage==='home') app.innerHTML=homePage();
 else if(currentPage==='find') app.innerHTML=findPage();
 else if(currentPage==='rent') app.innerHTML=rentPage();
 else if(currentPage==='how') app.innerHTML=howPage();
 else if(currentPage==='about') app.innerHTML=aboutPage();
 else if(currentPage==='reviews') app.innerHTML=reviewsPage();
 else if(currentPage==='contact') app.innerHTML=contactPage();
 else if(currentPage==='login') app.innerHTML=loginPage();
 else if(currentPage==='ownerDash') app.innerHTML=ownerDashPage();
 else if(currentPage==='farmerDash') app.innerHTML=farmerDashPage();
 else if(currentPage.startsWith('detail-')){let id=currentPage.split('-')[1]; app.innerHTML=detailPage(id);}
 attachEvents();
}

function findPage(){
let machines=getMachines();
let filtered = machines;

// Location filter - agar us location ka machine nahi hai to 0 mat dikhao, nearest dikhao
if(findFilters.location && findFilters.location !== 'All Maharashtra' && findFilters.location !== 'All India' && findFilters.location.trim() !== ''){
  let temp = machines.filter(m=>m.location.toLowerCase().includes(findFilters.location.toLowerCase()));
  if(temp.length > 0){
    filtered = temp;
  }
  // agar temp empty hai to filtered = all machines hi rehne do
}
if(findFilters.type && findFilters.type.trim() !== ''){
  // Rotavator -> Rotavator banake search karo
  let searchType = findFilters.type.replace('Tractors','Tractor').replace('Rotavators','Rotavator').replace('Harvesters','Harvester');
  let temp2 = filtered.filter(m=>m.type.toLowerCase().includes(searchType.toLowerCase()) || m.name.toLowerCase().includes(searchType.toLowerCase()));
  if(temp2.length > 0) filtered = temp2;
}
 let html = `<div class="max-w-7xl mx-auto px-4 py-8 grid lg:grid-cols-[320px_1fr] gap-6">
 <div class="bg-white rounded-2xl border p-5 h-fit">
 <h3 class="font-bold">Find Machinery</h3>
 <div class="mt-4 space-y-3">
 <input id="f-location" value="${findFilters.location||''}" placeholder="Location" class="w-full border p-2.5 rounded-xl text-sm">
 <input id="f-area" value="${findFilters.area||''}" placeholder="Farm area (acres)" class="w-full border p-2.5 rounded-xl text-sm">
 <input id="f-work" value="${findFilters.work||''}" placeholder="Type of work (ploughing...)" class="w-full border p-2.5 rounded-xl text-sm">
 <select id="f-type" class="w-full border p-2.5 rounded-xl text-sm"><option value="">Any Machine</option><option ${findFilters.type=='Tractor'?'selected':''}>Tractor</option><option ${findFilters.type=='Harvester'?'selected':''}>Harvester</option><option ${findFilters.type=='Rotavator'?'selected':''}>Rotavator</option><option ${findFilters.type=='Cultivator'?'selected':''}>Cultivator</option><option ${findFilters.type=='Seed Drill'?'selected':''}>Seed Drill</option></select>
 <input id="f-date" value="${findFilters.date||''}" type="date" class="w-full border p-2.5 rounded-xl text-sm">
 <input id="f-duration" value="${findFilters.duration||''}" placeholder="Duration (hours)" class="w-full border p-2.5 rounded-xl text-sm">
 <input id="f-budget" value="${findFilters.budget||''}" placeholder="Budget (₹/day)" class="w-full border p-2.5 rounded-xl text-sm">
 <button onclick="applyFind()" class="w-full bg-primary text-white py-3 rounded-xl font-semibold">Find Best Match</button>
 </div>
 <div class="mt-6"><div class="font-semibold text-sm">Filters</div>
 <div class="mt-2 flex flex-wrap gap-2"><button onclick="sortBy('match')" class="px-3 py-1 bg-gray-100 rounded-full text-xs">Best Match</button><button onclick="sortBy('nearest')" class="px-3 py-1 bg-gray-100 rounded-full text-xs">Nearest</button><button onclick="sortBy('price')" class="px-3 py-1 bg-gray-100 rounded-full text-xs">Lowest Price</button></div>
 </div>
 </div>
 <div><div class="flex justify-between items-center"><div class="font-bold">${filtered.length} machines found</div><select id="sortSelect" onchange="sortBy(this.value)" class="border p-2 rounded-xl text-sm"><option value="match">Best Match</option><option value="nearest">Nearest</option><option value="price">Lowest Price</option><option value="rating">Highest Rated</option></select></div>
 <div id="machineGrid" class="mt-4 grid md:grid-cols-2 gap-4">
 ${filtered.map(m=>{
  let score=aiScore(m,findFilters);
  return `<div class="bg-white rounded-2xl border overflow-hidden hover:shadow-lg transition">
   <div class="relative"><img src="${m.image}" class="h-44 w-full object-cover"><div class="absolute top-3 left-3 bg-white px-2 py-1 rounded-full text-xs font-bold">🏆 ${score.total}% Best Match</div><button onclick="toggleFav('${m.id}')" class="absolute top-3 right-3 w-8 h-8 bg-white rounded-full"><i class="fa-${getFavs().includes(m.id)?'solid':'regular'} fa-heart ${getFavs().includes(m.id)?'text-red-500':''}"></i></button><div class="absolute bottom-3 right-3 bg-black/70 text-white px-2 py-1 rounded-full text-xs">${m.availability?'Available':'Busy'}</div></div>
   <div class="p-4"><div class="flex justify-between"><div class="font-bold text-sm">${m.name}</div><div class="text-xs">⭐ ${m.rating}</div></div><div class="text-xs text-gray-500 mt-1">${m.owner} • ${m.location} • ${m.distance}km</div>
   <div class="mt-2 flex gap-2 text-xs"><span class="px-2 py-1 bg-green-50 rounded-full">₹${m.priceHour}/hr</span><span class="px-2 py-1 bg-yellow-50 rounded-full">₹${m.priceDay}/day</span></div>
   <div class="mt-2 text-[11px] text-gray-500">Location ${score.locScore}% • Work ${score.workScore}% • Price ${score.priceScore}%</div>
   <div class="mt-3 flex gap-2"><button onclick="navigate('detail-${m.id}')" class="flex-1 border py-2 rounded-xl text-sm">View Details</button><button onclick="bookMachine('${m.id}')" class="flex-1 bg-primary text-white py-2 rounded-xl text-sm font-semibold">Book Now</button></div>
   </div></div>`;
 }).join('')}
 </div></div></div>`;
 return html;
}

function sortBy(type){
 let grid=document.getElementById('machineGrid'); if(!grid) return;
 let machines=[...getMachines()];
 if(findFilters.location) machines=machines.filter(m=>m.location.toLowerCase().includes(findFilters.location.toLowerCase()));
 if(findFilters.type) machines=machines.filter(m=>m.type.toLowerCase().includes(findFilters.type.toLowerCase()));
 if(type==='nearest') machines.sort((a,b)=>a.distance-b.distance);
 if(type==='price') machines.sort((a,b)=>a.priceDay-b.priceDay);
 if(type==='rating') machines.sort((a,b)=>b.rating-a.rating);
 if(type==='match') machines.sort((a,b)=>aiScore(b,findFilters).total - aiScore(a,findFilters).total);
 // re-render filtered grid quickly
 let filteredHTML = machines.map(m=>{let score=aiScore(m,findFilters); return `<div class="bg-white rounded-2xl border overflow-hidden"><div class="relative"><img src="${m.image}" class="h-44 w-full object-cover"><div class="absolute top-3 left-3 bg-white px-2 py-1 rounded-full text-xs font-bold">🏆 ${score.total}%</div></div><div class="p-4"><div class="font-bold text-sm">${m.name}</div><div class="text-xs text-gray-500">${m.location} • ${m.distance}km • ₹${m.priceHour}/hr</div><div class="mt-3 flex gap-2"><button onclick="navigate('detail-${m.id}')" class="flex-1 border py-2 rounded-xl text-sm">View</button><button onclick="bookMachine('${m.id}')" class="flex-1 bg-primary text-white py-2 rounded-xl text-sm">Book</button></div></div></div>`}).join('');
 grid.innerHTML=filteredHTML;
}

 let name=document.getElementById('o-name').value||'Demo Owner'; let phone=document.getElementById('o-phone').value||'9876543210'; let type=document.getElementById('o-type').value; let model=document.getElementById('o-model').value||'New Tractor'; let ph=parseInt(document.getElementById('o-ph').value)||800; let pd=parseInt(document.getElementById('o-pd').value)||6000; let loc=document.getElementById('o-loc').value||'Nagpur'; let img=document.getElementById('o-img').value||'https://images.unsplash.com/photo-1625246333195-78d9c38ad449?w=600'; let desc=document.getElementById('o-desc').value||'Well maintained machine';
